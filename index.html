<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Colombia 🌸</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #fff7f9;
    color: #1f1f1f;
    min-height: 100vh;
  }

  /* HERO */
  .hero {
    background: linear-gradient(160deg, #fce7f3 0%, #fbcfe8 50%, #fda4af 100%);
    padding: 48px 24px 36px;
  }
  .hero-inner { max-width: 520px; margin: 0 auto; }
  .pill {
    display: inline-block;
    background: rgba(255,255,255,0.55);
    border: 1px solid #f9a8d4;
    color: #be185d;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 14px;
  }
  .hero h1 {
    font-size: 42px;
    font-weight: 700;
    color: #831843;
    letter-spacing: -1px;
    line-height: 1.05;
    margin-bottom: 10px;
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #9d174d;
    font-style: italic;
  }
  .hero-meta .dot { color: #f9a8d4; }

  /* SYNC STATUS */
  .sync-bar {
    background: #fff;
    border-bottom: 1px solid #fce7f3;
    padding: 6px 16px;
    text-align: center;
    font-size: 11px;
    color: #9ca3af;
    font-style: italic;
  }
  .sync-bar.ok { color: #6ee7b7; }
  .sync-bar.err { color: #fca5a5; }

  /* TABS */
  .tab-bar {
    display: flex;
    border-bottom: 1px solid #fce7f3;
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    color: #d1d5db;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab-btn.active { color: #ec4899; border-bottom: 2px solid #ec4899; }

  /* BODY */
  .body { max-width: 520px; margin: 0 auto; padding: 24px 16px 80px; }

  .section-title {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #f472b6;
    margin-bottom: 14px;
    margin-top: 4px;
  }

  /* TOGGLE */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .toggle-label { font-size: 12px; color: #9ca3af; font-style: italic; }
  .toggle-pill {
    display: flex;
    background: #fce7f3;
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
  }
  .toggle-opt {
    border: none;
    background: transparent;
    border-radius: 16px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: #f9a8d4;
    font-family: inherit;
    transition: all 0.18s;
  }
  .toggle-opt.active { background: #ec4899; color: #fff; }

  /* TOTAL BANNER */
  .total-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, #fce7f3, #fda4af);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 24px;
  }
  .total-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #be185d;
    margin-bottom: 4px;
  }
  .total-primary { font-size: 28px; font-weight: 700; color: #831843; letter-spacing: -1px; }
  .total-secondary { font-size: 12px; color: #f472b6; margin-top: 2px; }

  /* EXP CARD */
  .exp-card {
    background: #fff;
    border: 1px solid #fce7f3;
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .exp-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 16px;
    cursor: pointer;
    user-select: none;
  }
  .exp-icon { font-size: 18px; }
  .exp-label { font-size: 14px; font-weight: 600; color: #374151; flex: 1; }
  .exp-total { font-size: 13px; font-weight: 700; color: #ec4899; }
  .exp-chevron { color: #f9a8d4; font-size: 13px; }
  .exp-body { padding: 0 16px 14px; display: none; }
  .exp-body.open { display: block; }

  .exp-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    gap: 8px;
  }
  .exp-item-name { font-size: 13px; color: #374151; flex: 1; }
  .exp-item-primary { font-size: 13px; font-weight: 700; color: #be185d; text-align: right; }
  .exp-item-secondary { font-size: 10px; color: #d1d5db; text-align: right; }
  .divider { height: 1px; background: #fce7f3; margin: 4px 0; }
  .subtotal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0 0;
  }
  .subtotal-label { color: #9ca3af; font-size: 11px; }

  /* MINI FORM */
  .mini-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
    padding: 12px;
    background: #fff7f9;
    border-radius: 10px;
    border: 1px solid #fce7f3;
  }
  .mini-input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #fce7f3;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    color: #374151;
    background: #fff;
    outline: none;
  }
  textarea.mini-input { resize: vertical; min-height: 60px; }
  .btn-row { display: flex; gap: 6px; }
  .btn-pink {
    background: #ec4899;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-ghost {
    background: none;
    border: 1px solid #fce7f3;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    color: #9ca3af;
    cursor: pointer;
    font-family: inherit;
  }
  .add-row-btn {
    background: none;
    border: none;
    color: #f9a8d4;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    padding: 4px 0;
    text-align: left;
    font-family: inherit;
  }
  .comment-btn {
    background: none;
    border: 1px dashed #fce7f3;
    border-radius: 8px;
    color: #d1d5db;
    font-size: 11px;
    cursor: pointer;
    padding: 5px 10px;
    width: 100%;
    text-align: left;
    font-family: inherit;
    margin-top: 8px;
  }
  .remove-btn {
    background: none;
    border: none;
    color: #fca5a5;
    font-size: 18px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
    flex-shrink: 0;
  }

  /* CITY BLOCK */
  .city-block {
    border: 1.5px solid;
    border-radius: 16px;
    margin-bottom: 20px;
    overflow: hidden;
    background: #fff;
  }
  .city-block.bogota { border-color: #fbcfe8; }
  .city-block.cartagena { border-color: #fda4af; }
  .city-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
  }
  .city-header.bogota { background: #fbcfe8; }
  .city-header.cartagena { background: #fda4af; }
  .city-name { font-weight: 800; font-size: 15px; letter-spacing: -0.3px; }
  .city-name.bogota { color: #ec4899; }
  .city-name.cartagena { color: #e11d48; }
  .city-dates { font-size: 11px; color: #9ca3af; }
  .concert-tag {
    margin-left: auto;
    background: #fce7f3;
    color: #831843;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .day-section { padding: 12px 16px; border-top: 1px solid #fce7f3; }
  .day-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .day-label.bogota { color: #ec4899; }
  .day-label.cartagena { color: #e11d48; }
  .event-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
    padding: 8px 10px;
    background: #fff7f9;
    border-radius: 10px;
  }
  .event-time { font-size: 11px; font-weight: 700; color: #f472b6; min-width: 40px; margin-top: 1px; }
  .event-title { font-size: 13px; font-weight: 600; color: #374151; }
  .event-note { font-size: 11px; color: #9ca3af; margin-top: 2px; font-style: italic; }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 40px;
    color: #f9a8d4;
    font-style: italic;
    font-size: 14px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-inner">
    <div class="pill">21 – 28 noviembre 2026</div>
    <h1>Colombia</h1>
    <div class="hero-meta">
      <span>Bogotá · Cartagena</span>
      <span class="dot">·</span>
      <span>🎤 Hayley Williams</span>
    </div>
  </div>
</div>

<!-- SYNC STATUS -->
<div class="sync-bar" id="syncBar">Conectando...</div>

<!-- TABS -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab(0)">Gastos</button>
  <button class="tab-btn" onclick="switchTab(1)">Itinerario</button>
</div>

<div class="body">

  <!-- ── GASTOS TAB ── -->
  <div id="tab-gastos">
    <div class="loading" id="gastos-loading">Cargando gastos... 🌸</div>
    <div id="gastos-content" class="hidden">
      <div class="toggle-row">
        <span class="toggle-label">Ingresar en</span>
        <div class="toggle-pill">
          <button class="toggle-opt active" id="btn-usd" onclick="setCurrency('usd')">USD $</button>
          <button class="toggle-opt" id="btn-cop" onclick="setCurrency('cop')">COP</button>
        </div>
      </div>
      <div id="total-banner" class="hidden total-banner">
        <div>
          <div class="total-label">Total estimado</div>
          <div class="total-primary" id="total-primary">$0.00 USD</div>
          <div class="total-secondary" id="total-secondary"></div>
        </div>
        <span style="font-size:32px">✈️</span>
      </div>
      <div class="section-title">Categorías</div>
      <div id="exp-cards"></div>
    </div>
  </div>

  <!-- ── ITINERARIO TAB ── -->
  <div id="tab-itinerario" class="hidden">
    <div class="loading" id="itin-loading">Cargando itinerario... 🌸</div>
    <div id="itin-content" class="hidden">
      <div class="section-title">Tu viaje día a día</div>
      <div id="bogota-block"></div>
      <div id="cartagena-block"></div>
    </div>
  </div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBTuCMIWSgdb7Y0lFejDosM5zu6M2V_zR4",
  authDomain: "colombia-trip-8d006.firebaseapp.com",
  projectId: "colombia-trip-8d006",
  storageBucket: "colombia-trip-8d006.firebasestorage.app",
  messagingSenderId: "276940740619",
  appId: "1:276940740619:web:fc0513e7f1bc54b74bcf0e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── CONSTANTS ──
const USD_TO_COP = 4150;
const CATS = [
  { id: "concierto", label: "Boleto concierto", icon: "🎤" },
  { id: "airbnb",    label: "Airbnb",           icon: "🏠" },
  { id: "vuelos",    label: "Vuelos",            icon: "✈️" },
  { id: "tours",     label: "Tours",             icon: "🗺️" },
  { id: "comida",    label: "Comida & bebida",   icon: "🍽️" },
  { id: "ropa",      label: "Ropa & zapatos",    icon: "👟" },
  { id: "souvenirs", label: "Souvenirs",         icon: "🛍️" },
  { id: "uber",      label: "Uber",              icon: "🚗" },
  { id: "otros",     label: "Otros",             icon: "📦" },
];
const BOGOTA_DAYS    = ["21 nov","22 nov","23 nov","24 nov"];
const CARTAGENA_DAYS = ["24 nov","25 nov","26 nov","27 nov","28 nov"];

// ── STATE ──
let usdMode = true;
let expenses = {};
let itinerary = { bogota: {}, cartagena: {} };
let openCards = {};
let openForms = {}; // 'add' | 'comment' | null per cat
let openItinForms = {}; // day key

CATS.forEach(c => { expenses[c.id] = { items: [], comment: "" }; });
BOGOTA_DAYS.forEach(d => itinerary.bogota[d] = []);
CARTAGENA_DAYS.forEach(d => itinerary.cartagena[d] = []);

// ── FIRESTORE ──
const expRef  = doc(db, "trip", "expenses");
const itinRef = doc(db, "trip", "itinerary");

function setSyncBar(msg, cls = "") {
  const bar = document.getElementById("syncBar");
  bar.textContent = msg;
  bar.className = "sync-bar " + cls;
}

async function saveExpenses() {
  try {
    await setDoc(expRef, expenses);
    setSyncBar("✓ Guardado", "ok");
    setTimeout(() => setSyncBar("Sincronizado 🌸"), 2000);
  } catch(e) { setSyncBar("Error al guardar", "err"); }
}

async function saveItinerary() {
  try {
    await setDoc(itinRef, itinerary);
    setSyncBar("✓ Guardado", "ok");
    setTimeout(() => setSyncBar("Sincronizado 🌸"), 2000);
  } catch(e) { setSyncBar("Error al guardar", "err"); }
}

// Listen expenses
onSnapshot(expRef, snap => {
  if (snap.exists()) {
    const data = snap.data();
    CATS.forEach(c => {
      if (data[c.id]) expenses[c.id] = data[c.id];
    });
  }
  document.getElementById("gastos-loading").classList.add("hidden");
  document.getElementById("gastos-content").classList.remove("hidden");
  renderExpenses();
  setSyncBar("Sincronizado 🌸");
});

// Listen itinerary
onSnapshot(itinRef, snap => {
  if (snap.exists()) {
    const data = snap.data();
    if (data.bogota) itinerary.bogota = data.bogota;
    if (data.cartagena) itinerary.cartagena = data.cartagena;
  }
  document.getElementById("itin-loading").classList.add("hidden");
  document.getElementById("itin-content").classList.remove("hidden");
  renderItinerary();
});

// ── CURRENCY ──
window.setCurrency = function(mode) {
  usdMode = mode === 'usd';
  document.getElementById('btn-usd').className = 'toggle-opt' + (usdMode ? ' active' : '');
  document.getElementById('btn-cop').className = 'toggle-opt' + (!usdMode ? ' active' : '');
  renderExpenses();
};

function fmtPrimary(val) {
  const n = parseFloat(val) || 0;
  return usdMode ? `$${n.toFixed(2)}` : `${n.toLocaleString("es-CO")} COP`;
}
function fmtSecondary(val) {
  const n = parseFloat(val) || 0;
  return usdMode
    ? `${(n * USD_TO_COP).toLocaleString("es-CO")} COP`
    : `$${(n / USD_TO_COP).toFixed(2)} USD`;
}
function totalItems(items) {
  return items.reduce((s,i) => s + (parseFloat(i.primary)||0), 0);
}

// ── RENDER EXPENSES ──
function renderExpenses() {
  // Total banner
  const grand = CATS.reduce((s,c) => s + totalItems(expenses[c.id].items), 0);
  const banner = document.getElementById("total-banner");
  if (grand > 0) {
    banner.classList.remove("hidden");
    document.getElementById("total-primary").textContent = fmtPrimary(grand);
    document.getElementById("total-secondary").textContent = fmtSecondary(grand);
  } else {
    banner.classList.add("hidden");
  }

  const container = document.getElementById("exp-cards");
  container.innerHTML = "";
  CATS.forEach(cat => {
    container.appendChild(buildExpCard(cat));
  });
}

function buildExpCard(cat) {
  const data = expenses[cat.id];
  const total = totalItems(data.items);
  const isOpen = openCards[cat.id];
  const form = openForms[cat.id];

  const card = document.createElement("div");
  card.className = "exp-card";

  // Header
  const header = document.createElement("div");
  header.className = "exp-header";
  header.innerHTML = `
    <span class="exp-icon">${cat.icon}</span>
    <span class="exp-label">${cat.label}</span>
    ${total > 0 ? `<span class="exp-total">${fmtPrimary(total)}</span>` : ''}
    <span class="exp-chevron">${isOpen ? '▲' : '▼'}</span>
  `;
  header.onclick = () => { openCards[cat.id] = !openCards[cat.id]; renderExpenses(); };
  card.appendChild(header);

  if (!isOpen) return card;

  // Body
  const body = document.createElement("div");
  body.className = "exp-body open";

  // Items
  if (data.items.length > 0) {
    data.items.forEach(item => {
      const row = document.createElement("div");
      row.className = "exp-item";
      row.innerHTML = `
        <span class="exp-item-name">${item.name}</span>
        ${item.primary ? `
          <div style="text-align:right">
            <div class="exp-item-primary">${fmtPrimary(item.primary)}</div>
            <div class="exp-item-secondary">${fmtSecondary(item.primary)}</div>
          </div>` : ''}
        <button class="remove-btn" data-id="${item.id}" data-cat="${cat.id}">×</button>
      `;
      row.querySelector(".remove-btn").onclick = (e) => {
        expenses[cat.id].items = expenses[cat.id].items.filter(i => i.id != e.target.dataset.id);
        saveExpenses(); renderExpenses();
      };
      body.appendChild(row);
    });
    const div = document.createElement("div");
    div.className = "divider";
    body.appendChild(div);
    if (total > 0) {
      const sub = document.createElement("div");
      sub.className = "subtotal-row";
      sub.innerHTML = `
        <span class="subtotal-label">Subtotal</span>
        <div style="text-align:right">
          <div style="font-weight:700;font-size:13px;color:#be185d">${fmtPrimary(total)}</div>
          <div style="font-size:10px;color:#d1d5db">${fmtSecondary(total)}</div>
        </div>`;
      body.appendChild(sub);
    }
  }

  // Add item form
  if (form === 'add') {
    const mf = document.createElement("div");
    mf.className = "mini-form";
    mf.innerHTML = `
      <input class="mini-input" id="new-name-${cat.id}" placeholder="Nombre (ej. Vuelo BOG-CTG)" />
      <input class="mini-input" id="new-amt-${cat.id}" type="number" placeholder="${usdMode ? '$ importe' : 'COP importe'}" style="width:140px" />
      <div class="btn-row">
        <button class="btn-pink" id="add-item-${cat.id}">Añadir</button>
        <button class="btn-ghost" id="cancel-add-${cat.id}">Cancelar</button>
      </div>`;
    body.appendChild(mf);
    setTimeout(() => {
      document.getElementById(`add-item-${cat.id}`).onclick = () => {
        const name = document.getElementById(`new-name-${cat.id}`).value.trim();
        const amt  = document.getElementById(`new-amt-${cat.id}`).value;
        if (!name) return;
        expenses[cat.id].items.push({ id: Date.now(), name, primary: amt });
        openForms[cat.id] = null;
        saveExpenses(); renderExpenses();
      };
      document.getElementById(`cancel-add-${cat.id}`).onclick = () => {
        openForms[cat.id] = null; renderExpenses();
      };
    }, 0);
  } else {
    const btn = document.createElement("button");
    btn.className = "add-row-btn";
    btn.textContent = "+ añadir elemento";
    btn.onclick = () => { openForms[cat.id] = 'add'; renderExpenses(); };
    body.appendChild(btn);
  }

  // Comment form
  if (form === 'comment') {
    const mf = document.createElement("div");
    mf.className = "mini-form";
    mf.innerHTML = `
      <textarea class="mini-input" id="comment-${cat.id}" placeholder="Notas, confirmaciones, links...">${data.comment || ''}</textarea>
      <div class="btn-row">
        <button class="btn-pink" id="save-comment-${cat.id}">Guardar</button>
        <button class="btn-ghost" id="cancel-comment-${cat.id}">Cancelar</button>
      </div>`;
    body.appendChild(mf);
    setTimeout(() => {
      document.getElementById(`save-comment-${cat.id}`).onclick = () => {
        expenses[cat.id].comment = document.getElementById(`comment-${cat.id}`).value;
        openForms[cat.id] = null;
        saveExpenses(); renderExpenses();
      };
      document.getElementById(`cancel-comment-${cat.id}`).onclick = () => {
        openForms[cat.id] = null; renderExpenses();
      };
    }, 0);
  } else {
    const cbtn = document.createElement("button");
    cbtn.className = "comment-btn";
    cbtn.textContent = data.comment ? `📝 ${data.comment.slice(0,40)}${data.comment.length>40?'…':''}` : '＋ comentario';
    cbtn.onclick = () => { openForms[cat.id] = 'comment'; renderExpenses(); };
    body.appendChild(cbtn);
  }

  card.appendChild(body);
  return card;
}

// ── RENDER ITINERARY ──
function renderItinerary() {
  renderCityBlock("bogota",    BOGOTA_DAYS,    "#fbcfe8", "#ec4899", "Bogotá",    "🏙️", "21 – 24 nov", true);
  renderCityBlock("cartagena", CARTAGENA_DAYS, "#fda4af", "#e11d48", "Cartagena", "🏖️", "24 – 28 nov", false);
}

function renderCityBlock(city, days, headerBg, accent, name, emoji, dates, hasConcert) {
  const container = document.getElementById(`${city}-block`);
  container.innerHTML = "";

  const block = document.createElement("div");
  block.className = `city-block ${city}`;

  // City header
  const ch = document.createElement("div");
  ch.className = `city-header ${city}`;
  ch.innerHTML = `
    <span style="font-size:22px">${emoji}</span>
    <div>
      <div class="city-name ${city}">${name}</div>
      <div class="city-dates">${dates}</div>
    </div>
    ${hasConcert ? '<span class="concert-tag" style="margin-left:auto">🎤 Concierto 23 nov</span>' : ''}
  `;
  block.appendChild(ch);

  days.forEach(day => {
    const events = itinerary[city][day] || [];
    const ds = document.createElement("div");
    ds.className = "day-section";

    const dl = document.createElement("div");
    dl.className = `day-label ${city}`;
    dl.textContent = day;
    ds.appendChild(dl);

    events.forEach(ev => {
      const row = document.createElement("div");
      row.className = "event-row";
      row.innerHTML = `
        ${ev.time ? `<span class="event-time">${ev.time}</span>` : ''}
        <div style="flex:1">
          <div class="event-title">${ev.title}</div>
          ${ev.note ? `<div class="event-note">${ev.note}</div>` : ''}
        </div>
        <button class="remove-btn" data-city="${city}" data-day="${day}" data-id="${ev.id}">×</button>
      `;
      row.querySelector(".remove-btn").onclick = (e) => {
        const { city: c, day: d, id } = e.target.dataset;
        itinerary[c][d] = itinerary[c][d].filter(ev => ev.id != id);
        saveItinerary(); renderItinerary();
      };
      ds.appendChild(row);
    });

    // Add form
    const formKey = `${city}-${day}`;
    if (openItinForms[formKey]) {
      const mf = document.createElement("div");
      mf.className = "mini-form";
      mf.innerHTML = `
        <input class="mini-input" id="ev-title-${formKey}" placeholder="¿Qué haréis?" />
        <input class="mini-input" id="ev-time-${formKey}" placeholder="Hora (ej. 15:00)" style="width:140px" />
        <input class="mini-input" id="ev-note-${formKey}" placeholder="Nota opcional" />
        <div class="btn-row">
          <button class="btn-pink" id="ev-add-${formKey}">Añadir</button>
          <button class="btn-ghost" id="ev-cancel-${formKey}">Cancelar</button>
        </div>`;
      ds.appendChild(mf);
      setTimeout(() => {
        document.getElementById(`ev-add-${formKey}`).onclick = () => {
          const title = document.getElementById(`ev-title-${formKey}`).value.trim();
          if (!title) return;
          const time  = document.getElementById(`ev-time-${formKey}`).value;
          const note  = document.getElementById(`ev-note-${formKey}`).value;
          if (!itinerary[city][day]) itinerary[city][day] = [];
          itinerary[city][day].push({ id: Date.now(), title, time, note });
          openItinForms[formKey] = false;
          saveItinerary(); renderItinerary();
        };
        document.getElementById(`ev-cancel-${formKey}`).onclick = () => {
          openItinForms[formKey] = false; renderItinerary();
        };
      }, 0);
    } else {
      const ab = document.createElement("button");
      ab.className = "add-row-btn";
      ab.textContent = "+ añadir plan";
      ab.onclick = () => { openItinForms[formKey] = true; renderItinerary(); };
      ds.appendChild(ab);
    }

    block.appendChild(ds);
  });

  container.appendChild(block);
}

// ── TAB SWITCH ──
window.switchTab = function(i) {
  document.getElementById("tab-gastos").classList.toggle("hidden", i !== 0);
  document.getElementById("tab-itinerario").classList.toggle("hidden", i !== 1);
  document.querySelectorAll(".tab-btn").forEach((b,j) => b.classList.toggle("active", i===j));
};

</script>
</body>
</html>
